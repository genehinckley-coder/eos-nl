<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EOS ION — Natural Language Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sohne:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0b0c0e;
    --bg-1: #111316;
    --bg-2: #16191d;
    --bg-3: #1c2026;
    --line: #232830;
    --line-soft: #1a1e23;
    --ink-0: #f1efeb;
    --ink-1: #cfcbc3;
    --ink-2: #a8a49a;
    --ink-3: #9a958b;
    --amber: oklch(0.78 0.13 75);
    --amber-soft: oklch(0.78 0.13 75 / 0.18);
    --amber-line: oklch(0.78 0.13 75 / 0.35);
    --cool: oklch(0.78 0.06 230);
    --green: oklch(0.78 0.13 150);
    --red: oklch(0.7 0.18 25);
    --magenta: oklch(0.72 0.18 340);
    --radius: 4px;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-0);
    color: var(--ink-0);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Subtle channel-grid texture overlay on body */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 48px 48px;
    z-index: 0;
  }

  #root {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: var(--amber-soft); color: var(--ink-0); }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 0; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #2a2f37; background-clip: padding-box; border: 2px solid transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="translator.jsx"></script>
  <script type="text/babel" src="status-bar.jsx"></script>
  <script type="text/babel" src="history.jsx"></script>
  <script type="text/babel" src="composer.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
